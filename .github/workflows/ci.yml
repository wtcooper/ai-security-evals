name: skills-ci

on:
  push:
    branches: [develop, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PROMPTFOO_DISABLE_TELEMETRY: "true"
      PROMPTFOO_DISABLE_REMOTE_GENERATION: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Python env
        run: uv sync --extra dev

      - name: Node tests
        run: |
          node tools/tests/status_policy.test.cjs
          node tools/tests/transform_response.test.cjs
          node tools/tests/extract_transcript.test.cjs
          node plugins/defense-evals/skills/control-isolate/tests/generic_guardrail.test.cjs

      - name: Python tests
        run: uv run pytest tools/tests plugins/defense-evals/skills/control-bench/tests plugins/model-evals/skills/model-benchmark/tests -q

      - name: No drift — vendored skill copies match tools/
        run: |
          bash tools/sync_skills.sh
          git diff --exit-code -- plugins/*/skills/*/lib plugins/*/skills/*/corpus \
            plugins/*/skills/*/new_experiment.sh plugins/*/skills/*/ephemeral_repo.sh plugins/*/skills/*/install_dependencies.sh \
            plugins/*/skills/*/objectives

      - name: Plugins conform to Agent Plugins 1.0.0; generated manifests are current
        run: |
          python scripts/check_plugins.py
          python scripts/gen_manifests.py --check

      - name: Skills are copy-paste self-contained
        run: bash scripts/check_independence.sh

      - name: Validate promptfoo configs
        run: |
          for d in app-benchmark control-isolate app-redteam; do
            ( cd plugins/*/skills/"$d" && npx -y promptfoo@latest validate -c promptfooconfig.yaml )
          done
