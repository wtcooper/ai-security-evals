name: skills-ci

on:
  push:
    branches: [develop, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PROMPTFOO_DISABLE_TELEMETRY: "true"
      PROMPTFOO_DISABLE_REMOTE_GENERATION: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Python env
        run: uv sync --extra dev

      - name: Node tests
        run: |
          node tools/tests/status_policy.test.cjs
          node tools/tests/transform_response.test.cjs
          node tools/tests/extract_transcript.test.cjs
          node skills/control-isolate/tests/generic_guardrail.test.cjs

      - name: Python tests
        run: uv run pytest tools/tests skills/control-bench/tests -q

      - name: No drift — vendored skill copies match tools/
        run: |
          bash tools/sync_skills.sh
          git diff --exit-code -- skills/*/lib skills/app-eval/corpus skills/control-isolate/corpus \
            skills/*/new_experiment.sh skills/*/ephemeral_repo.sh skills/*/install_dependencies.sh \
            skills/app-redteam/objectives

      - name: Skills are copy-paste self-contained
        run: bash scripts/check_independence.sh

      - name: Validate promptfoo configs
        run: |
          for d in app-eval control-isolate app-redteam; do
            ( cd "skills/$d" && npx -y promptfoo@latest validate -c promptfooconfig.yaml )
          done
