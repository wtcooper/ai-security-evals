[project]
name = "meridian-workspace"
version = "0.1.0"
description = "Research operations workspace"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn==0.53.0",
  "httpx==0.28.1",
]

[dependency-groups]
dev = ["pytest>=9,<10"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
