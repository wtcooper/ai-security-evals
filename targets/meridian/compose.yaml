name: meridian

x-app: &app
  image: ${MERIDIAN_IMAGE:-meridian-workspace:local}
  init: true
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs: [/tmp]
  networks: [services]
  environment: &environment
    MERIDIAN_DATA: /data
    SIGNING_KEY: ${SIGNING_KEY:?Run ./manage.sh init first}
    CONNECTOR_KEY: ${CONNECTOR_KEY:?Run ./manage.sh init first}
    MODEL_URL: ${MODEL_URL:-http://model:8091/v1}
    MODEL_NAME: ${MODEL_NAME:-meridian-local}
    MODEL_API_KEY: ${MODEL_API_KEY:-local}
    CONNECTOR_URL: http://connector:8092
    VAULT_URL: http://vault:8093

services:
  initialize:
    <<: *app
    build: .
    command: [uv, run, --no-sync, python, -m, meridian.seed]
    volumes: [workspace:/data]
    restart: "no"
  api:
    <<: *app
    volumes: [workspace:/data]
    depends_on:
      initialize: {condition: service_completed_successfully}
      model: {condition: service_healthy}
      connector: {condition: service_healthy}
    healthcheck:
      test: [CMD, uv, run, --no-sync, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 5s
      timeout: 3s
      retries: 12
  worker:
    <<: *app
    command: [uv, run, --no-sync, python, -m, meridian.worker]
    volumes: [workspace:/data]
    depends_on:
      api: {condition: service_healthy}
      vault: {condition: service_healthy}
  model:
    <<: *app
    environment: {}
    command: [uv, run, --no-sync, uvicorn, meridian.model_server:app, --host, 0.0.0.0, --port, "8091"]
    healthcheck:
      test: [CMD, uv, run, --no-sync, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8091/health')"]
      interval: 5s
      timeout: 3s
      retries: 12
  connector:
    <<: *app
    environment: {}
    command: [uv, run, --no-sync, uvicorn, meridian.connector_server:app, --host, 0.0.0.0, --port, "8092"]
    volumes: [connector-data:/connector-data]
    healthcheck:
      test: [CMD, uv, run, --no-sync, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8092/health')"]
      interval: 5s
      timeout: 3s
      retries: 12
  vault:
    <<: *app
    environment: {}
    command: [uv, run, --no-sync, uvicorn, meridian.vault_server:app, --host, 0.0.0.0, --port, "8093"]
    volumes: [vault-data:/vault-data]
    healthcheck:
      test: [CMD, uv, run, --no-sync, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8093/health')"]
      interval: 5s
      timeout: 3s
      retries: 12
  gateway:
    image: nginx:1.30.5-alpine
    user: "101:101"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp, "/var/cache/nginx:uid=101,gid=101"]
    volumes: [./deploy/nginx.conf:/etc/nginx/nginx.conf:ro]
    ports: ["127.0.0.1:${MERIDIAN_PORT:-8088}:8080"]
    networks: [ingress, services]
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/health]
      interval: 5s
      timeout: 3s
      retries: 12

networks:
  ingress: {}
  services:
    internal: true

volumes:
  workspace: {}
  connector-data: {}
  vault-data: {}
