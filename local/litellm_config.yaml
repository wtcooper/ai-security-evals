# Local LiteLLM proxy config for ai-guardrail-eval harness testing.
#
# This proxy lives entirely on the developer's machine and is the gateway
# under test. It ships with three mock target models, a mock judge model,
# and a mock pre-call guardrail so the full harness pipeline can be exercised
# with zero API keys and zero token spend.
#
# To wire in REAL upstream models / guardrails:
#   1. Add entries under model_list pointing at real providers. Store the
#      real API keys in .env.local at the repo root (gitignored).
#   2. Add real guardrail entries (panw-prisma-airs, lakera_ai, etc.) under
#      guardrails: per LiteLLM's docs.
#   3. Override JUDGE_MODEL in the environment to use a real judge model
#      (gpt-4o-mini is a good default).
#
# Start the proxy with: bash local/start_proxy.sh

model_list:
  # ---- Mock targets (no API keys needed) -----------------------------------
  - model_name: mock-target-compliant
    litellm_params:
      model: mock-target/compliant
  - model_name: mock-target-refusal
    litellm_params:
      model: mock-target/refusal
  - model_name: mock-target-policy-block
    litellm_params:
      model: mock-target/policy-block

  # ---- Mock judge (no API keys needed) -------------------------------------
  - model_name: mock-judge
    litellm_params:
      model: mock-judge/judge

  # ---- Real upstream examples (commented out; uncomment + set real keys) ---
  # - model_name: gpt-4o-mini
  #   litellm_params:
  #     model: openai/gpt-4o-mini
  #     api_key: os.environ/OPENAI_API_KEY
  # - model_name: claude-haiku-4-5
  #   litellm_params:
  #     model: anthropic/claude-haiku-4-5
  #     api_key: os.environ/ANTHROPIC_API_KEY

litellm_settings:
  custom_provider_map:
    - provider: mock-target
      custom_handler: mock_handlers.mock_target_llm
    - provider: mock-judge
      custom_handler: mock_handlers.mock_judge_llm

guardrails:
  # ---- Mock guardrail (no API keys; blocks on obvious adversarial patterns)
  - guardrail_name: mock-guardrail
    litellm_params:
      guardrail: mock_handlers.MockBlockGuardrail
      mode: pre_call

  # ---- Real guardrail examples (commented out) -----------------------------
  # - guardrail_name: lakera-pre
  #   litellm_params:
  #     guardrail: lakera_v2
  #     mode: pre_call
  #     api_key: os.environ/LAKERA_API_KEY

general_settings:
  master_key: sk-mock
