[project]
name = "ai-security-evals"
version = "0.1.0"
description = "Distributable Claude Code skills for AI security evaluation"
requires-python = ">=3.11,<3.13"
readme = "README.md"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.28.1,<0.29",
    "tqdm>=4.67.3,<5",
    "litellm[proxy]>=1.85.1,<2",
]

[project.optional-dependencies]
corpus = [
    "datasets>=4.8.5,<5",
]
# NOTE: control-bench's engine (inspect_ai / inspect_evals) is intentionally NOT a
# dependency here — it conflicts with litellm[proxy], and it doesn't need to share a
# venv: control-bench talks to the gateway over HTTP via the shim. Install Inspect in
# its own env:  uv venv .venv-inspect && .venv-inspect/bin/python -m pip install inspect_ai inspect_evals
dev = [
    "pytest>=9.0.3,<10",
    "pytest-asyncio>=1.3,<2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = [
    "tools/tests",
    "skills/control-bench/tests",
]
asyncio_mode = "auto"
filterwarnings = ["ignore::pytest.PytestCollectionWarning"]
