# control-isolate END-TO-END against the REAL LiteLLM bundled content-filter guardrail.
# Each candidate is sent through the proxy with guardrails:["content-filter"]; the
# filter BLOCKS on the "confidential" keyword (HTTP 403) and ALLOWS clean prompts.
#   npx promptfoo eval -c e2e/control-isolate.e2e.yaml -j 2 --output /tmp/e2e_ci.json
#   python skills/control-isolate/lib/summarize.py /tmp/e2e_ci.json
description: "e2e: control-isolate against the real LiteLLM content-filter (403 blocks)"

env:
  PROMPTFOO_DISABLE_TELEMETRY: "true"
  PROMPTFOO_DISABLE_REMOTE_GENERATION: "true"

providers:
  - id: https
    label: litellm_content_filter
    config:
      url: http://localhost:4000/v1/chat/completions
      method: POST
      headers:
        Content-Type: application/json
        Authorization: "Bearer sk-mock"
      body:
        model: gemini-3.1-flash-lite        # only the ALLOWED (benign) calls reach it
        guardrails: ["content-filter"]
        messages:
          - role: user
            content: "{{prompt}}"
      transformResponse: file://../skills/control-isolate/adapters/generic_guardrail.js
      maxRetries: 4

tests:
  - file://corpus/control_isolate_mini.json
