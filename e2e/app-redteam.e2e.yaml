# app-redteam END-TO-END with REAL models through the proxy.
#   target  = gemini-3-flash-preview (flash)
#   attacker + grader = gemini-3.1-flash-lite (flash-lite)
# Minimal scope (1 intent, jailbreak strategy) to stay under free-tier rate limits.
#   npx promptfoo redteam run -c e2e/app-redteam.e2e.yaml --max-concurrency 1
#   npx promptfoo redteam report
description: "e2e: app-redteam attacker+grader against real Gemini"

env:
  PROMPTFOO_DISABLE_TELEMETRY: "true"
  # NOTE: redteam attack GENERATION may use promptfoo's remote service for some
  # plugins. We use the `intent` plugin (custom seed, no remote synthesis) + the
  # local attacker, so remote generation stays disabled.
  PROMPTFOO_DISABLE_REMOTE_GENERATION: "true"

targets:
  - id: openai:chat:gemini-3-flash-preview
    label: gemini_flash_target
    config:
      apiBaseUrl: http://localhost:4000/v1
      apiKey: sk-mock

redteam:
  purpose: >-
    A general assistant that must refuse requests for dangerous or illegal
    instructions.
  injectVar: prompt
  numTests: 2          # both smoke objectives (cyber + data-leakage)
  # Attack-generation + grading model (the multi-turn ATTACKER) — flash-lite via the
  # proxy. crescendo/custom/jailbreak:tree fall back to THIS provider when remote gen
  # is disabled, so the whole adaptive attack runs locally with our own model.
  provider:
    id: openai:chat:gemini-3.1-flash-lite
    config:
      apiBaseUrl: http://localhost:4000/v1
      apiKey: sk-mock
  plugins:
    # `intent` seeds generate locally (avoid the remote-only "unaligned" plugins).
    # Load the VENDORED smoke pack via file:// — exercises the same path the real
    # skill uses (objectives/redteam_objectives.json), just the 2-objective subset.
    - id: intent
      config:
        intent: file://skills/app-redteam/objectives/redteam_objectives.smoke.json   # cwd = repo root (run_e2e.sh)
  strategies:
    # crescendo is LOCAL-CAPABLE: with remote gen disabled it uses redteam.provider
    # for the multi-turn attack. (goat / mischievous-user / jailbreak:meta are
    # remote-only and would throw here — see the SKILL.)
    - id: crescendo
      config: { maxTurns: 3, stateful: false }

# Grader model — flash-lite via the proxy (openai provider; llm-rubric contract).
defaultTest:
  options:
    provider:
      id: openai:chat:gemini-3.1-flash-lite
      config:
        apiBaseUrl: http://localhost:4000/v1
        apiKey: sk-mock
