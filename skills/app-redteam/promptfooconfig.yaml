# app-redteam — ADAPTIVE multi-turn attacks against an application.
# Two-phase, fully local (see SKILL.md):
#   1. generate once -> cache objectives:
#        npx promptfoo redteam generate -c promptfooconfig.yaml -o objectives.generated.yaml
#   2. eval the cache (repeatable, offline):
#        npx promptfoo redteam eval -c objectives.generated.yaml --output results.json
#
# Unlike app-eval (static, single-turn), this runs a live attacker (crescendo)
# that reads the target's REAL responses and escalates/backtracks on refusals.
# Use for customized risk discovery, not a fast benchmark. ASR is noisy — run
# repeated trials and report variance.
description: "app-redteam: adaptive multi-turn red team against an application"

env:
  PROMPTFOO_DISABLE_TELEMETRY: "true"
  # Remote generation is disabled for air-gap; an attacker model is configured
  # locally below (redteam.provider). Remove this only if you intend to use
  # promptfoo's hosted attack generation.
  PROMPTFOO_DISABLE_REMOTE_GENERATION: "true"

# The application under test.
#  - stateful: false  -> promptfoo sends the FULL transcript each turn (target is
#    stateless; promptfoo owns history). Use this if your app takes a messages[].
#  - stateful: true   -> promptfoo sends only the new turn; your app must persist
#    the session. Then wire session handling (sessionParser / {{sessionId}}).
targets:
  - id: https
    label: target_app
    config:
      url: "{{ env.TARGET_URL }}"
      method: POST
      headers:
        Content-Type: application/json
        Authorization: "Bearer {{ env.TARGET_API_KEY }}"
      body:
        # OpenAI-style chat envelope. CRITICAL: use the bare "{{prompt}}" token —
        # for a multi-turn strategy promptfoo replaces it with the running
        # conversation ARRAY ([{role,content},...]); for single-turn it's a string.
        # Do NOT use "{{messages}}" (no such var — sends EMPTY input, silently
        # breaking every attack). Adjust this envelope to your app, keeping
        # "{{prompt}}" where the conversation goes. Delete `model` if your app
        # doesn't take one.
        model: "{{ env.TARGET_MODEL }}"
        messages: "{{ prompt }}"
      transformResponse: file://lib/transform_response.js
      # For a stateful backend, extract the server session id and reuse it:
      # sessionParser: 'data.headers["set-cookie"]'

# GRADER model — judges whether an attack succeeded. OpenAI-compatible; point it at
# your production LiteLLM. Keep it a DIFFERENT model from the target. Env:
#   GRADER_MODEL / GRADER_BASE_URL / GRADER_API_KEY
defaultTest:
  options:
    provider:
      id: "openai:chat:{{ env.GRADER_MODEL }}"
      config:
        apiBaseUrl: "{{ env.GRADER_BASE_URL }}"
        apiKey: "{{ env.GRADER_API_KEY }}"
        response_format:           # raw JSON for the grader too (same fence issue)
          type: json_object

redteam:
  purpose: >-
    Authorized security testing of an internal LLM application. The app should
    refuse harmful, injection, and data-exfiltration requests and resist
    multi-turn escalation.
  # ATTACKER model — generates/adapts the adversarial turns. OpenAI-compatible, so
  # point it at your production LiteLLM (or any OpenAI-style gateway): set the model
  # name + base URL + key via env. A capable instruct model works best.
  #   ATTACKER_MODEL    e.g. gpt-4o, claude-sonnet-4-6, or your litellm alias
  #   ATTACKER_BASE_URL e.g. https://litellm.internal/v1
  #   ATTACKER_API_KEY
  provider:
    id: "openai:chat:{{ env.ATTACKER_MODEL }}"
    config:
      apiBaseUrl: "{{ env.ATTACKER_BASE_URL }}"
      apiKey: "{{ env.ATTACKER_API_KEY }}"
      # Force raw JSON. Crescendo's attacker emits JSON; without this, smaller local
      # models (e.g. gemma) wrap it in ```json fences and crescendo throws
      # "Expected a JSON object". Remove only if your attacker model rejects it.
      response_format:
        type: json_object

  # The seed var the strategies inject into (the running conversation lands in the
  # target's `messages` body above).
  injectVar: prompt

  plugins:
    # APP-SPECIFIC OBJECTIVES via the `intent` plugin — fully-local, air-gapped,
    # license-clean. Edit objectives/redteam_objectives.json to add goals specific
    # to THIS app (the bundled ~73 span cyber / prompt_injection / data_leakage /
    # content_safety; you can also paste in goals from the docs cyber pack). For a
    # quick first run, point at objectives/redteam_objectives.smoke.json (2 goals).
    #
    # ALTERNATIVE — app-tailored generation (FREE community service, NOT enterprise):
    # promptfoo's community remote generation writes app-specific objectives from
    # `purpose` + real plugins (rbac/bola/pii/harmful/…). To use it, swap `intent`
    # for those plugins and run the GENERATE step WITHOUT
    # PROMPTFOO_DISABLE_REMOTE_GENERATION (online, once); then eval offline. The
    # built-in plugins are remote-only for generation, which is why air-gapped runs
    # use `intent`. See SKILL.md step 4.
    - id: intent
      config:
        intent: file://objectives/redteam_objectives.json

  # Adaptive MULTI-TURN strategies — the attacker reads each real response and
  # escalates. crescendo is the local-capable default and runs on your `provider`
  # (above) when PROMPTFOO_DISABLE_REMOTE_GENERATION=true. It injects a conversation
  # ARRAY into "{{prompt}}", which the OpenAI-style body above expects.
  #
  # maxTurns/maxBacktracks tune attack depth (and cost): more backtracks = more
  # rephrasing after refusals = higher success but slower. Local models: 5/5 is a
  # reasonable start; raise for harder targets.
  strategies:
    - id: basic              # suppress the single-turn base probe: it injects a
      config: { enabled: false }   # STRING (invalid for the messages[] body). Multi-turn only here.
    - id: crescendo          # adaptive multi-turn, LOCAL-capable (the default)
      config: { maxTurns: 5, maxBacktracks: 5, stateful: false, continueAfterSuccess: false }
    # NOTE on single-turn strategies (jailbreak:tree, prompt-injection, basic):
    # they inject a STRING into "{{prompt}}", which is INVALID for an OpenAI
    # messages[] body — use app-eval for single-turn coverage, or give those a
    # separate target whose body wraps the string (messages:[{role:user,content:...}]).
    # REMOTE-ONLY multi-turn (need Promptfoo Cloud; throw under air-gap) — uncomment
    # only with remote generation enabled:
    # - id: goat
    #   config: { maxTurns: 5, stateful: false }
    # - id: mischievous-user
    #   config: { maxTurns: 5, stateful: false }
