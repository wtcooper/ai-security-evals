# app-eval — fast static security benchmark against an application endpoint.
#   npx promptfoo eval -c promptfooconfig.yaml --output results.json
#   python summarize.py results.json
#
# Single-turn quality cases + M2S-flattened multi-turn, from the shared corpus.
# Air-gapped: no telemetry, no remote generation.
description: "app-eval: static adversarial benchmark (injection / harmful / leakage / over-refusal + M2S)"

env:
  PROMPTFOO_DISABLE_TELEMETRY: "true"
  PROMPTFOO_DISABLE_REMOTE_GENERATION: "true"

# The application under test. Fill url/headers/body for your endpoint.
# transformResponse classifies each response body-first (status as a hint):
#   answer -> judged; block (body signal or hint status) -> guardrails block;
#   infra error (5xx/429/auth) -> excluded; ambiguous -> judged. New vendor block
#   codes (e.g. LiteLLM 403) are caught with no config. See summarize's per-status
#   histogram. To A/B/C a param-based control, duplicate this provider with a
#   different label and set the guardrail param in `body`.
providers:
  - id: https
    label: target_app
    config:
      url: "{{ env.TARGET_URL }}"
      method: POST
      headers:
        Content-Type: application/json
        Authorization: "Bearer {{ env.TARGET_API_KEY }}"
      body:
        # adjust to your app's schema; {{prompt}} is the per-test user input
        messages:
          - role: user
            content: "{{prompt}}"
      transformResponse: file://../_shared/transform_response.js
      # promptfoo retries transient infra (network/timeout, 429, transient 5xx) up to
      # maxRetries BEFORE transformResponse; 4xx/blocks are never retried. Set
      # PROMPTFOO_RETRY_5XX=true to retry all 5xx. Default maxRetries is 4.
      maxRetries: 2

# Judge model (every test carries its own llm-rubric criterion). Must be an
# OpenAI-compatible provider — llm-rubric's grader contract needs it (a raw `https`
# provider sends null content to a strict gateway). Point JUDGE_BASE_URL at the
# gateway base (e.g. https://litellm.internal/v1) and set JUDGE_MODEL. WARN if the
# judge model == the target model.
defaultTest:
  options:
    provider:
      id: "openai:chat:{{ env.JUDGE_MODEL }}"
      config:
        apiBaseUrl: "{{ env.JUDGE_BASE_URL }}"
        apiKey: "{{ env.JUDGE_API_KEY }}"

# Built by skills/_shared/build_corpus.py (offline, bundled).
tests:
  - file://../_shared/corpus/promptfoo/injection.json
  - file://../_shared/corpus/promptfoo/data_leakage.json
  - file://../_shared/corpus/promptfoo/harmful.json
  - file://../_shared/corpus/promptfoo/benign_overrefusal.json
